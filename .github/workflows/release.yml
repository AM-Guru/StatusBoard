name: Build and Release

# Every commit to main builds and ships Status Board to TestFlight, the same way
# Slaptop releases from main.
#
# It runs on a repository-level self-hosted runner on `media`, registered as
# `statusboard-media`. media is a LAN address, so a GitHub-hosted runner could
# not reach it.
#
#   Labels: self-hosted, macOS, X64, media, statusboard
#   Note **X64, not ARM64** — the Mac is Apple silicon, but the native arm64
#   runner package fails to start there (CoreCLR 0x8007000C), so it runs the
#   x86_64 package under Rosetta. Asking for ARM64 queues every job forever.
#
# The runner holds no signing material. Scripts/ci-release.sh imports an
# "Apple Distribution" identity from a secret into a throwaway keychain and
# removes it afterwards. See docs/ci-setup.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build (the watch app ships inside the iOS build)
        required: true
        default: all
        type: choice
        options: [all, ios, macos, tvos]
      upload:
        description: Upload to TestFlight
        required: true
        default: true
        type: boolean

concurrency:
  group: statusboard-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    if: github.repository == 'AM-Guru/StatusBoard'
    runs-on: [self-hosted, macOS, media, statusboard]
    timeout-minutes: 30
    steps:
      - name: Check out the commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        shell: bash
        working-directory: Packages/StatusBoardKit
        run: swift test

  release:
    name: Build and upload to TestFlight
    needs: test
    # Only the real repository, only main or a v* tag, never a fork or a PR.
    if: >-
      github.repository == 'AM-Guru/StatusBoard' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_type == 'branch') ||
        (github.event_name == 'push' && github.ref_type == 'tag') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: [self-hosted, macOS, media, statusboard]
    environment: statusboard-release
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_DISTRIBUTION: ${{ vars.APP_STORE_DISTRIBUTION }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Ensure XcodeGen is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            command -v brew >/dev/null
            brew install xcodegen
          fi
          xcodegen --version

      - name: Validate release configuration
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_STORE_DISTRIBUTION_P12_BASE64: ${{ secrets.APP_STORE_DISTRIBUTION_P12_BASE64 }}
          APP_STORE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
          TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
        run: Scripts/validate-release-configuration.sh

      - name: Derive build number
        id: build_number
        shell: bash
        run: echo "value=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build, sign and upload
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_STORE_DISTRIBUTION_P12_BASE64: ${{ secrets.APP_STORE_DISTRIBUTION_P12_BASE64 }}
          APP_STORE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
          TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
          UPLOAD_INPUT: ${{ github.event.inputs.upload }}
        run: |
          set -euo pipefail
          # A manual run honours its checkbox; a push to main or a tag always
          # uploads. Decided here rather than in a GitHub expression, where the
          # *string* "false" is truthy and would upload anyway.
          if [[ -n "${UPLOAD_INPUT}" ]]; then
            DO_UPLOAD="${UPLOAD_INPUT}"
          else
            DO_UPLOAD=true
          fi
          export DO_UPLOAD
          Scripts/ci-release.sh

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StatusBoard-${{ steps.build_number.outputs.value }}
          path: |
            Artifacts/*.ipa
            Artifacts/*.pkg
            Artifacts/**/*.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 14
