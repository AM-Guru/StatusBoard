name: Build and Release

# `media` (192.168.1.10) is on the LAN, so GitHub-hosted runners cannot reach
# it over SSH. The build therefore runs on a repository-level self-hosted
# runner installed on media, registered as `statusboard-media`.
#
# Its labels are: self-hosted, macOS, X64, media, statusboard. Note **X64, not
# ARM64** — the Mac is Apple silicon, but the native arm64 runner package fails
# to start there (CoreCLR 0x8007000C), so it runs the x86_64 package under
# Rosetta. Asking for an ARM64 label leaves every job queued forever.
#
# See docs/ci-setup.md for the remaining prerequisites.

on:
  push:
    branches: [main]      # verify every push: test + build, no upload
    tags: ["v*"]          # cut a release: test + build + upload
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build and upload (the watch app ships inside the iOS build)
        required: true
        default: all
        type: choice
        options: [all, ios, macos, tvos]
      upload:
        description: Upload to TestFlight
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, macOS, media]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Unit tests
        working-directory: Packages/StatusBoardKit
        run: swift test

  build:
    needs: test
    # Signing and uploading only happen for a release. A push to main just runs
    # the tests above, so ordinary work does not need signing credentials.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, media]
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen if missing
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The API key is written to the location xcodebuild/altool look in, then
      # removed in the always() cleanup step below.
      - name: Stage App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Derive build number
        id: build_number
        run: echo "value=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and upload
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
          UPLOAD_INPUT: ${{ github.event.inputs.upload }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          ARGS=(--build-number "$BUILD_NUMBER" --platforms "$PLATFORMS")
          # A manual run honours its checkbox; otherwise only tags upload, so a
          # push to main verifies the build without spending a TestFlight slot.
          if [ -n "$UPLOAD_INPUT" ]; then
            [ "$UPLOAD_INPUT" = "true" ] && ARGS+=(--upload) || true
          elif [ "$IS_TAG" = "true" ]; then
            ARGS+=(--upload)
          fi
          echo "running: ./Scripts/release.sh ${ARGS[*]}"
          ./Scripts/release.sh "${ARGS[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StatusBoard-${{ steps.build_number.outputs.value }}
          path: |
            Artifacts/*.ipa
            Artifacts/*.pkg
            Artifacts/**/*.xcarchive/Info.plist
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove staged key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
